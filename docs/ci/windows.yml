name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas-y-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Pruebas (las que necesitan ViGEmBus se saltan en la nube)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest app/tests -q
      - name: Compilar exe (onedir)
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: DSU-Pad-windows
          path: dist/*.zip
      - name: Publicar en Releases (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
